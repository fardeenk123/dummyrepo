<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - HealthCare Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd 0%, #ffffff 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100vh;
            background: linear-gradient(180deg, #d32f2f 0%, #b71c1c 100%);
            color: yellow;
            padding: 20px 0;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }
        
        .sidebar h4 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
            padding: 0 20px;
        }
        
        .sidebar .nav-link {
            color: white;
            padding: 15px 25px;
            margin: 5px 15px;
            border-radius: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }
        
        .main-content {
            margin-left: 250px;
            padding: 30px;
            min-height: 100vh;
        }
        
        .dashboard-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .doctor-card {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            background: white;
            transition: all 0.3s ease;
        }
        
        .doctor-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }
        
        .btn-approve {
            background: linear-gradient(45deg, #4caf50, #66bb6a);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
        }
        
        .btn-reject {
            background: linear-gradient(45deg, #f44336, #ef5350);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
        }
        
        .welcome-header {
            background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
        
        .custom-toast {
            min-width: 300px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        
        .toast-success {
            background: linear-gradient(135deg, #4caf50, #66bb6a);
            color: white;
        }
        
        .toast-error {
            background: linear-gradient(135deg, #f44336, #ef5350);
            color: white;
        }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>
    
    <div class="sidebar">
        <h4>🛡️ Admin Portal</h4>
        <nav class="nav flex-column">
            <a class="nav-link active" onclick="showTab('pending')">⏳ Pending Doctors</a>
            <a class="nav-link" onclick="showTab('approved')">✅ Approved Doctors</a>
            <a class="nav-link" onclick="showTab('rejected')">❌ Rejected Doctors</a>
            <a class="nav-link" onclick="logout()">🚪 Logout</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="welcome-header">
            <h2>Welcome, Admin!</h2>
            <p>Manage doctor registrations and approvals</p>
        </div>

        <div class="dashboard-card" id="pendingTab">
            <h4>Pending Doctor Registrations</h4>
            <div id="pendingDoctorsList"></div>
        </div>
        
        <div class="dashboard-card" id="approvedTab" style="display: none;">
            <h4>Approved Doctors</h4>
            <div id="approvedDoctorsList"></div>
        </div>
        
        <div class="dashboard-card" id="rejectedTab" style="display: none;">
            <h4>Rejected Doctors</h4>
            <div id="rejectedDoctorsList"></div>
        </div>
    </div>
    


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadPendingDoctors();
        });
        
        function showTab(tabName) {
            // Hide all tabs
            document.getElementById('pendingTab').style.display = 'none';
            document.getElementById('approvedTab').style.display = 'none';
            document.getElementById('rejectedTab').style.display = 'none';
            
            // Remove active class from all nav links
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            
            // Show selected tab and mark nav as active
            if (tabName === 'pending') {
                document.getElementById('pendingTab').style.display = 'block';
                event.target.classList.add('active');
                loadPendingDoctors();
            } else if (tabName === 'approved') {
                document.getElementById('approvedTab').style.display = 'block';
                event.target.classList.add('active');
                loadApprovedDoctors();
            } else if (tabName === 'rejected') {
                document.getElementById('rejectedTab').style.display = 'block';
                event.target.classList.add('active');
                loadRejectedDoctors();
            }
        }

        function loadPendingDoctors() {
            fetch('/api/admin/pending-doctors')
                .then(response => response.json())
                .then(doctors => {
                    displayPendingDoctors(doctors);
                })
                .catch(error => {
                    console.error('Error loading pending doctors:', error);
                });
        }

        function displayPendingDoctors(doctors) {
            const doctorsList = document.getElementById('pendingDoctorsList');
            doctorsList.innerHTML = '';
            
            if (doctors.length === 0) {
                doctorsList.innerHTML = '<p class="text-muted">No pending doctor registrations.</p>';
                return;
            }
            
            doctors.forEach(doctor => {
                const doctorCard = document.createElement('div');
                doctorCard.className = 'doctor-card';
                
                const licensePhotoHtml = `<p class="mb-1"><strong>License Photo:</strong> <button class="btn btn-sm btn-outline-primary" onclick="showLicenseModal('${doctor.name}', '${doctor.licensePhotoPath || ''}')">📄 View License</button></p>`;
                
                doctorCard.innerHTML = `
                    <div class="row">
                        <div class="col-md-8">
                            <h6>${doctor.icon} ${doctor.name}</h6>
                            <p class="mb-1"><strong>Specialty:</strong> ${doctor.specialty}</p>
                            <p class="mb-1"><strong>Email:</strong> ${doctor.email}</p>
                            <p class="mb-1"><strong>Experience:</strong> ${doctor.experience}</p>
                            <p class="mb-1"><strong>Qualification:</strong> ${doctor.qualification}</p>
                            <p class="mb-1"><strong>License Number:</strong> ${doctor.licenseNumber || 'Not provided'}</p>
                            <p class="mb-0"><strong>Consultant Fee:</strong> $${doctor.consultantFee || 'Not set'}</p>
                        </div>
                        <div class="col-md-4 text-end">
                            <button class="btn btn-approve me-2 mb-2" onclick="approveDoctor(${doctor.id})">
                                ✅ Approve
                            </button>
                            <button class="btn btn-reject mb-2" onclick="rejectDoctor(${doctor.id})">
                                ❌ Reject
                            </button>
                        </div>
                    </div>
                `;
                doctorsList.appendChild(doctorCard);
            });
        }

        function approveDoctor(doctorId) {
            fetch(`/api/admin/approve-doctor/${doctorId}`, {
                method: 'POST'
            })
            .then(response => response.text())
            .then(result => {
                if (result === 'success') {
                    showToast('Doctor Approved', 'Doctor has been approved successfully!', 'success');
                    loadPendingDoctors();
                } else {
                    showToast('Approval Failed', 'Error: ' + result, 'error');
                }
            })
            .catch(error => {
                showToast('Approval Failed', 'Error approving doctor', 'error');
            });
        }

        function rejectDoctor(doctorId) {
            if (confirm('Are you sure you want to reject this doctor registration?')) {
                fetch(`/api/admin/reject-doctor/${doctorId}`, {
                    method: 'POST'
                })
                .then(response => response.text())
                .then(result => {
                    if (result === 'success') {
                        showToast('Doctor Rejected', 'Doctor registration has been rejected.', 'error');
                        loadPendingDoctors();
                    } else {
                        showToast('Rejection Failed', 'Error: ' + result, 'error');
                    }
                })
                .catch(error => {
                    showToast('Rejection Failed', 'Error rejecting doctor', 'error');
                });
            }
        }

        function showToast(title, message, type) {
            const toastContainer = document.getElementById('toastContainer');
            const toastId = 'toast-' + Date.now();
            
            const toastHTML = `
                <div class="toast custom-toast toast-${type}" id="${toastId}" role="alert">
                    <div class="toast-header" style="background: rgba(255, 255, 255, 0.1); border: none; color: white;">
                        <strong class="me-auto">${title}</strong>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
                    </div>
                    <div class="toast-body" style="color: white;">
                        ${message}
                    </div>
                </div>
            `;
            
            toastContainer.insertAdjacentHTML('beforeend', toastHTML);
            
            const toastElement = document.getElementById(toastId);
            const toast = new bootstrap.Toast(toastElement, {
                autohide: true,
                delay: 3000
            });
            
            toast.show();
            
            toastElement.addEventListener('hidden.bs.toast', function() {
                toastElement.remove();
            });
        }

        function logout() {
            fetch('/logout', { method: 'POST' })
                .then(() => {
                    window.location.href = '/';
                });
        }
        
        function loadApprovedDoctors() {
            fetch('/api/admin/approved-doctors')
                .then(response => response.json())
                .then(doctors => {
                    displayDoctors(doctors, 'approvedDoctorsList', 'approved');
                })
                .catch(error => {
                    console.error('Error loading approved doctors:', error);
                });
        }
        
        function loadRejectedDoctors() {
            fetch('/api/admin/rejected-doctors')
                .then(response => response.json())
                .then(doctors => {
                    displayDoctors(doctors, 'rejectedDoctorsList', 'rejected');
                })
                .catch(error => {
                    console.error('Error loading rejected doctors:', error);
                });
        }
        
        function displayDoctors(doctors, containerId, status) {
            const doctorsList = document.getElementById(containerId);
            doctorsList.innerHTML = '';
            
            if (doctors.length === 0) {
                doctorsList.innerHTML = `<p class="text-muted">No ${status} doctors.</p>`;
                return;
            }
            
            doctors.forEach(doctor => {
                const doctorCard = document.createElement('div');
                doctorCard.className = 'doctor-card';
                
                doctorCard.innerHTML = `
                    <div class="row">
                        <div class="col-md-12">
                            <h6>${doctor.icon} ${doctor.name}</h6>
                            <p class="mb-1"><strong>Specialty:</strong> ${doctor.specialty}</p>
                            <p class="mb-1"><strong>Email:</strong> ${doctor.email}</p>
                            <p class="mb-1"><strong>Experience:</strong> ${doctor.experience}</p>
                            <p class="mb-1"><strong>Qualification:</strong> ${doctor.qualification}</p>
                            <p class="mb-1"><strong>License Number:</strong> ${doctor.licenseNumber || 'Not provided'}</p>
                            <p class="mb-0"><strong>Consultant Fee:</strong> $${doctor.consultantFee || 'Not set'}</p>
                        </div>
                    </div>
                `;
                doctorsList.appendChild(doctorCard);
            });
        }
    </script>
</body>
</html>
